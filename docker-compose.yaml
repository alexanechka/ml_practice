# Файл docker-compose должен начинаться с тега версии.

version: "1"

# Следует учитывать, что docker-composes работает с сервисами.
# 1 сервис = 1 контейнер.
# Сервисом может быть клиент, сервер, сервер баз данных...
# Раздел, в котором будут описаны сервисы, начинается с 'services'.

services:
  app:
    build: ./app/
    image: ml-service-app:latest
    container_name: ml-service-app
    env_file:
      - ./app/.env
    volumes:
      - ./app:/app
    networks:
      - ml-service-network

  web-proxy:
    image: nginx:stable-alpine3.24-perl
    container_name: ml_service_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./web-proxy/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - ml-service-network

  database:
    image: postgres:18-alpine3.24
    container_name: ml_service_db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    volumes:
      - ./database:/var/lib/postgresql
    networks:
      - ml-service-network

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: ml_service_rabbitmq
    restart: on-failure
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - ./rabbitmq:/var/lib/rabbitmq
    networks:
      - ml-service-network

networks:
  ml-service-network:
    driver: bridge
