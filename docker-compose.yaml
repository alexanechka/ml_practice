# Файл docker-compose должен начинаться с тега версии.

version: "2"

# Следует учитывать, что docker-composes работает с сервисами.
# 1 сервис = 1 контейнер.
# Сервисом может быть клиент, сервер, сервер баз данных...
# Раздел, в котором будут описаны сервисы, начинается с 'services'.

services:
  app:
    build: ./app/
    image: ml_service_app:latest
    container_name: ml_service_app
    env_file:
      - ./app/.env
    volumes:
      - ./app:/app
    networks:
      - ml-service-network
    healthcheck:
      test: ["CMD","python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web-proxy:
    image: nginx:stable-alpine3.24-perl
    container_name: ml_service_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./web-proxy/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - ml-service-network

  database:
    image: postgres:18-alpine3.24
    container_name: ml_service_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql
    networks:
      - ml-service-network

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: ml_service_rabbitmq
    restart: on-failure
    ports:
    - "15672:15672"
    - "5672:5672"
    env_file:
      - ./rabbitmq/.env
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    networks:
      - ml-service-network

  worker:
    build: ./ml_worker/
    image: ml_service_worker:latest
    restart: unless-stopped
    env_file:
    - ./app/.env
    volumes:
      - ./app/models:/app/models
      - ./app/services/crud:/app/services/crud
      - ./app/database:/app/database
      - ./ml_worker/worker.py:/app/worker.py
      - ./app/services/auth:/app/services/auth
    depends_on:
      - database
      - rabbitmq
    networks:
      - ml-service-network
    deploy:
      replicas: 2

  webview:
    build: ./webview/
    image: ml_service_webview:latest
    container_name: ml_service_webview
    restart: unless-stopped
    environment:
      - API_BASE_URL=http://app:8080/api
    volumes:
      - ./webview:/app
    ports:
      - "8501:8501"
    depends_on:
      - app
    networks:
      - ml-service-network

  ollama:
    image: ollama/ollama
    container_name: ml_service_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_volume:/root/.ollama
    networks:
      - ml-service-network


networks:
  ml-service-network:
    driver: bridge


volumes:
  postgres_volume:
  rabbitmq_volume:
  ollama_volume: