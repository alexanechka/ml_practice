# Файл docker-compose должен начинаться с тега версии.

version: "2"

# Следует учитывать, что docker-composes работает с сервисами.
# 1 сервис = 1 контейнер.
# Сервисом может быть клиент, сервер, сервер баз данных...
# Раздел, в котором будут описаны сервисы, начинается с 'services'.

services:
  app:
    build: ./app/
    image: ml-service-app:latest
    container_name: ml-service-app
    env_file:
      - ./app/.env
    volumes:
      - ./app:/app
    networks:
      - ml-service-network
    healthcheck:
      test: ["CMD","python", "-c", "import urlib.request; urlib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web-proxy:
    image: nginx:stable-alpine3.24-perl
    container_name: ml_service_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./web-proxy/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - ml-service-network

  database:
    image: postgres:18-alpine3.24
    container_name: ml_service_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_volume:/var/lib/postgresql
    networks:
      - ml-service-network

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: ml_service_rabbitmq
    restart: on-failure
    ports:
    - "15672:15672"
    - "5672:5672"
    env_file:
      - ./rabbitmq/.env
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    networks:
      - ml-service-network

networks:
  ml-service-network:
    driver: bridge


volumes:
  postgres_volume:
  rabbitmq_volume: